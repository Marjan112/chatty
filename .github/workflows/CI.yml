name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-windows-msvc:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Build debug (on main pushes)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cargo build

      - name: Build release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          cargo build --bin chatty_client --release

      - name: Zip the binary
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $Executable = "target/release/chatty_client.exe"
          $ZipName = "chatty_client-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip"
          Compress-Archive -Path $Executable -DestinationPath $ZipName

      - name: Release (create + upload)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          name: ChaTTY - ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: chatty_client-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
