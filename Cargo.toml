[package]
name = "chatty"
version = "0.11.0"
edition = "2024"

[[bin]]
name = "chatty_server"
path = "./src/server.rs"

[[bin]]
name = "chatty_client"
path = "./src/client.rs"

[dependencies]
chrono = "0.4.42"
postcard = {version = "1.1.3", features = ["alloc"]}
ratatui = { version = "0.30.0", features = ["serde", "unstable-rendered-line-info"] }
serde = { version = "1.0.228", features = ["derive"] }
ratatui-textarea = "0.9.0"
clap = { version = "4.6.5", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = "0.26.4"
rustls = { version = "0.23.43", features = ["ring"] }
rustls-pemfile = "2.2.0"
rcgen = "0.14.9"
sha2 = "0.11.0"
