[package]
name = "chatty"
version = "0.10.1"
edition = "2024"

[[bin]]
name = "chatty_server"
path = "./src/server.rs"

[[bin]]
name = "chatty_client"
path = "./src/client.rs"

[dependencies]
chrono = "0.4.42"
mio = { version = "1", features = ["net", "os-poll"] }
postcard = {version = "1.1.3", features = ["alloc"]}
ratatui = { version = "0.30.0", features = ["serde", "unstable-rendered-line-info"] }
serde = { version = "1.0.228", features = ["derive"] }
ratatui-textarea = "0.9.0"
