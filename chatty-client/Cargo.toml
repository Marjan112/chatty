[package]
name = "chatty-client"
version = "0.11.0"
edition = "2024"

[dependencies]
ratatui = { version = "0.30.0", features = ["serde", "unstable-rendered-line-info"] }
clap = { version = "4.6.5", features = ["derive"] }
tokio = { version = "1.53.1", features = ["time", "net", "rt", "rt-multi-thread", "macros"] }
rustls = { version = "0.23.43", features = ["ring"] }
tokio-rustls = "0.26.4"
ratatui-textarea = "0.9.0"
chrono = "0.4.42"

chatty-core = { path = "../chatty-core" }
