[package]
name = "chatty-client"
version.workspace = true
edition.workspace = true

[dependencies]
clap = { workspace = true }
tokio = { workspace = true, features = ["time", "net", "rt", "rt-multi-thread", "macros", "signal"] }
rustls = { workspace = true }
tokio-rustls = { workspace = true, default-features = false }
chrono = { workspace = true }
ratatui = { version = "0.30.0", features = ["serde", "unstable-rendered-line-info"] }
ratatui-textarea = "0.9.0"

chatty-core = { path = "../chatty-core" }
