[package]
name = "chatty-core"
version.workspace = true
edition.workspace = true

[dependencies]
chrono = "0.4.42"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["io-util"] }
