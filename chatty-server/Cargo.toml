[package]
name = "chatty-server"
version = "0.11.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "sync", "net", "macros"] }
rustls = "0.23.43"
clap = { version = "4.6.5", features = ["derive"] }
chrono = "0.4.42"
rcgen = "0.14.9"
rustls-pemfile = "2.2.0"
tokio-rustls = "0.26.4"

chatty-core = { path = "../chatty-core" }
